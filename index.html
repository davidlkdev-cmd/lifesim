<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Simulation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h2 class="sr-only" style="position:absolute;left:-9999px">Life simulation 720x800</h2>

  <div id="ui">
    <button id="btnPause">Pause</button>
    <label>Speed <input type="range" id="speed" min="1" max="8" value="3" step="1" style="width:80px"> <span id="speedVal">3</span>x</label>
    <button id="btnAdd">+ Add 10 dots</button>
  </div>

  <div id="legend">
    <div class="leg"><div class="leg-line" style="background:#f5c842"></div> married</div>
    <div class="leg"><div class="leg-line" style="background:#a78bfa; border-top: 2px dashed #a78bfa; height:0;"></div> parent-child</div>
  </div>

  <canvas id="c" width="720" height="800"></canvas>

  <div id="stats">
    <div class="stat">Population: <span id="sPop">0</span></div>
    <div class="stat">Couples: <span id="sMarried">0</span></div>
    <div class="stat">Births: <span id="sBirth">0</span></div>
    <div class="stat">Deaths: <span id="sDeath">0</span></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
